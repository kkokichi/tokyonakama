    <title>下北沢・上級謎解きゲーム | 下北コミュニティ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        /* --- 謎解きゲーム固有スタイル --- */
        body {
            /* ミステリアスなダークグラデーション */
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            color: #f0f0f0;
            min-height: 100vh;
        }

        .game-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* スタート画面 */
        .start-screen h1 {
            font-size: 2.2rem;
            color: #e67e22; /* オレンジ系のアクセント */
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(230, 126, 34, 0.5);
        }
        .start-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        /* 問題画面 */
        .question-screen {
            display: none; /* JSで制御 */
        }
        .question-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 10px;
            display: block;
        }
        .question-title {
            font-size: 1.5rem;
            color: #e67e22;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            white-space: pre-line; /* 改行を反映 */
        }
        .input-area {
            margin-bottom: 20px;
        }
        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            font-family: "Zen Maru Gothic", sans-serif;
            transition: border-color 0.3s;
        }
        .answer-input:focus {
            border-color: #e67e22;
            outline: none;
        }
        
        /* ヒントエリア */
        .hint-container {
            margin-top: 20px;
        }
        .hint-btn {
            background: transparent;
            border: 1px solid #aaa;
            color: #aaa;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .hint-btn:hover {
            border-color: #fff;
            color: #fff;
        }
        .hint-text {
            display: none;
            color: #f1c40f; /* 黄色 */
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: bold;
            background: rgba(241, 196, 15, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        /* クリア画面 */
        .clear-screen {
            display: none; /* JSで制御 */
        }
        .clear-title {
            font-size: 2rem;
            color: #27ae60; /* 成功色 */
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(39, 174, 96, 0.5);
        }
        .clear-msg {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .result-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .result-rank {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e67e22;
            margin: 10px 0;
        }

        /* アニメーション */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.5s;
            border-color: #e74c3c !important;
            background-color: rgba(231, 76, 60, 0.2);
        }

        @keyframes flash-red {
            0%, 100% { background-color: rgba(255, 255, 255, 0.1); }
            50% { background-color: rgba(231, 76, 60, 0.3); }
        }
        .flash-effect {
            animation: flash-red 0.4s ease-in-out;
        }

        .fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ボタンカスタマイズ */
        .game-btn {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 15px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 100px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }
        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.5);
            background-color: #d35400;
        }
        .share-btn {
            background-color: #000;
            margin-top: 15px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <header class="header">
    </header>
    <script src="header.js" defer></script>

    <section class="section game-section">
        <div class="container" style="width: 100%; display: flex; justify-content: center;">
            
            <!-- ゲームコンテナ -->
            <div id="game-container" class="game-card fade-in-up">
                
                <!-- スタート画面 -->
                <div id="start-screen" class="start-screen">
                    <span class="start-icon">🕵️‍♂️</span>
                    <h1>下北沢謎解きゲーム</h1>
                    <p>コースを選んで挑戦してください。</p>
                    <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px;">
                        <button id="start-normal-btn" class="game-btn">
                            🔰 街歩き編<br><span style="font-size:0.85rem; font-weight:normal;">（初心者向け・基礎知識）</span>
                        </button>
                        <button id="start-hard-btn" class="game-btn" style="background-color: #34495e;">
                            🔥 下北沢マスター編<br><span style="font-size:0.85rem; font-weight:normal;">（上級者向け・難問）</span>
                        </button>
                        <button id="start-brain-btn" class="game-btn" style="background-color: #8e44ad;">
                            🧠 頭脳編<br><span style="font-size:0.85rem; font-weight:normal;">（論理パズル・ひらめき）</span>
                        </button>
                    </div>
                </div>

                <!-- 問題画面 -->
                <div id="question-screen" class="question-screen">
                    <span id="q-number" class="question-number">Q1</span>
                    <h2 id="q-title" class="question-title"></h2>
                    <div id="q-text" class="question-text"></div>
                    
                    <div class="input-area">
                        <input type="text" id="answer-input" class="answer-input" placeholder="答えを入力" autocomplete="off">
                    </div>

                    <div class="hint-container">
                        <button id="hint-btn" class="hint-btn">💡 ヒントを見る</button>
                        <p id="hint-msg" class="hint-text"></p>
                    </div>

                    <button id="submit-btn" class="game-btn" style="margin-top: 20px;">回答する</button>
                </div>

                <!-- クリア画面 -->
                <div id="clear-screen" class="clear-screen">
                    <span class="start-icon">🎉</span>
                    <h2 class="clear-title">クリアおめでとう！</h2>
                    
                    <div class="result-box">
                        <p style="margin-bottom: 5px; font-weight: bold; color: #ccc;">あなたの称号</p>
                        <div id="result-rank" class="result-rank"></div>
                        <p id="result-comment" style="margin-bottom: 0; font-size: 0.95rem;"></p>
                    </div>
                    <p class="clear-msg">この難問を解き明かすとは...<br>あなたの頭脳は下北沢でもトップクラスです。</p>
                    
                    <a href="index.html" class="game-btn" style="text-decoration: none; margin-bottom: 15px;">トップページへ戻る</a>
                    <button id="share-btn" class="game-btn share-btn">Xで結果をシェア</button>
                </div>

            </div>

        </div>
    </section>

    <footer>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // --- 謎解きゲームロジック ---
            
            // 問題データ
            const questionSets = {
                normal: [
                    {
                        id: 1,
                        title: "永遠の青さ",
                        text: "高架の下に生まれた、実験する実験室。\nその名前は、ある『冬の果実』と同じ響きを持つが、意味は異なる。\n『完成しない』ことこそが、この街の美学。\nその場所の名前をカタカナ3文字で答えよ。",
                        answer: ["ミカン", "みかん"],
                        hint: "こたつで食べる冬の果物と同じ読み方。「未完成」の美学。"
                    },
                    {
                        id: 2,
                        title: "純白の弾倉",
                        text: "線路の跡地に現れた、白き迷宮。\n次々と店が入れ替わり、文化が再装填される場所。\n空になった銃に弾を込めるように、人々の心を再び満たす回廊。\nその建物の名前は、英語で何と言う？",
                        answer: ["リロード", "りろーど", "reload", "RELOAD"],
                        hint: "英語で「再装填」や「更新」。PCのブラウザでページを読み直すこともこう呼ぶ。"
                    },
                    {
                        id: 3,
                        title: "香りの正体",
                        text: "毎年10月になると、街中がこの香りに包まれる。\nフェスティバルも開催される、下北沢の代名詞とも言える料理は？",
                        answer: ["カレー", "かれー", "curry"],
                        hint: "スパイスを使って作ります。インドが発祥と言われています。"
                    },
                    {
                        id: 4,
                        title: "巡るファッション",
                        text: "新品ではないけれど、世界に一つだけの出会いがある。\n「東洋百貨店」や街のいたるところで売られている、昔の服を何と呼ぶ？",
                        answer: ["古着", "フルギ", "ふるぎ"],
                        hint: "「古い」「着物」と書きます。"
                    },
                    {
                        id: 5,
                        title: "交差する線路",
                        text: "下北沢駅で交わる2つの路線。\n一つは「小田急線」。もう一つは、渋谷と吉祥寺を結ぶ「〇〇〇〇線」？（カタカナで回答）",
                        answer: ["イノカシラ", "いのかしら", "井の頭"],
                        hint: "公園の名前にもなっています。"
                    }
                ],
                hard: [
                    {
                        id: 1,
                        title: "数字の儀式",
                        text: "この街を表す2つのコード。『OH07』と『IN05』。\nOHからINを引き、その数だけ『北』へ進め。そこにある、かつてアパートだった劇場の名は？",
                        answer: ["スズナリ", "すずなり", "ザ・スズナリ", "ザスズナリ"],
                        hint: "駅のナンバリング（OH=小田急、IN=井の頭）の数字を引き算してみて。"
                    },
                    {
                        id: 2,
                        title: "住所のパラドックス",
                        text: "私はみんなに愛されている名前だ。\n駅の名前にもなっている。\nしかし、地図を開いて『住所』を探しても、私はどこにも存在しない。\n『北沢』はあっても、『私』はいない。\n私の名前は？",
                        answer: ["下北沢", "シモキタザワ", "しもきたざわ"],
                        hint: "「北沢」1丁目はある。「代沢」もある。でも「〇〇〇〇」1丁目という住所はない。"
                    },
                    {
                        id: 3,
                        title: "伝説の夜",
                        text: "その店は、とある『伝説の俳優』が毎晩のように酒を飲んだ場所として知られる。\n店名は、ローリング・ストーンズの曲名ではないが、ジャズの名曲でもない。\nただ、三角地帯の角で、街を見守り続けるBarの名前。\n『レディ・〇〇〇〇』？",
                        answer: ["ジェーン", "じぇーん", "JANE", "jane"],
                        hint: "映画「ターザン」のヒロインと同じ名前。"
                    },
                    {
                        id: 4,
                        title: "地下の伝説",
                        text: "多くのロックバンドがここから羽ばたいた。\nアニメ「ぼっち・ざ・ろっく！」の聖地としても知られる、老舗ライブハウスの名前は？",
                        answer: ["シェルター", "SHELTER", "shelter"],
                        hint: "英語で「避難所」という意味です。"
                    },
                    {
                        id: 5,
                        title: "演劇の聖地",
                        text: "下北沢の演劇文化の象徴。\n元俳優のオーナーが建てた、駅前にある最も有名な劇場は？",
                        answer: ["本多劇場", "ホンダゲキジョウ", "ほんだげきじょう"],
                        hint: "「本多」さんが作った劇場です。"
                    }
                ],
                brain: [
                    {
                        id: 1,
                        title: "時間の迷宮",
                        text: "この世界では、\n5 + 8 = 1\n9 + 6 = 3\n11 + 4 = 3\nとなる。\n\nでは、7 + 7 = ？",
                        answer: ["2", "２"],
                        hint: "壁にかかっている「丸いもの」を想像して（12までしかありません）。"
                    },
                    {
                        id: 2,
                        title: "数列の果て",
                        text: "O, T, T, F, F, S, S, E, N, ...\n\nこの次に来るアルファベットは？",
                        answer: ["T", "t"],
                        hint: "数字を英語で数えてみて（One, Two...）。"
                    },
                    {
                        id: 3,
                        title: "漢字の錬金術",
                        text: "「日」に１画足すと「白」\n「日」に１画足すと「田」\n「日」に１画足すと「目」\n\nでは、「日」に１画足してできる、\n『古い』という意味の漢字は？（カタカナで回答）",
                        answer: ["キュウ", "きゅう", "旧"],
                        hint: "「新」の反対語です。"
                    },
                    {
                        id: 4,
                        title: "等式の罠",
                        text: "1 = 5\n2 = 25\n3 = 125\n4 = 625\n\nでは、5 = ？",
                        answer: ["1", "１"],
                        hint: "計算する必要はありません。一番最初の行を見て（1 = 5 なら...）。"
                    },
                    {
                        id: 5,
                        title: "増える数字",
                        text: "1, 2, 4, 7, 11, 16, ...\n\nこの次に来る数字は？",
                        answer: ["22", "２２"],
                        hint: "数字の「増え方」に注目してみて（+1, +2...）。"
                    }
                ]
            };

            let currentQuestions = [];
            let currentQuestionIndex = 0;
            let perfectScoreCount = 0; // ノーヒント（一発）正解数
            let hasMistaken = false;   // 現在の問題で間違えたかフラグ
            let hasUsedHint = false;   // 現在の問題でヒントを使ったか

            // DOM要素
            const gameContainer = document.getElementById('game-container');
            const startScreen = document.getElementById('start-screen');
            const questionScreen = document.getElementById('question-screen');
            const clearScreen = document.getElementById('clear-screen');
            
            const startNormalBtn = document.getElementById('start-normal-btn');
            const startHardBtn = document.getElementById('start-hard-btn');
            const startBrainBtn = document.getElementById('start-brain-btn');
            const submitBtn = document.getElementById('submit-btn');
            const shareBtn = document.getElementById('share-btn');
            const hintBtn = document.getElementById('hint-btn');
            
            const qNumber = document.getElementById('q-number');
            const qTitle = document.getElementById('q-title');
            const qText = document.getElementById('q-text');
            const answerInput = document.getElementById('answer-input');
            const hintMsg = document.getElementById('hint-msg');
            const resultRank = document.getElementById('result-rank');
            const resultComment = document.getElementById('result-comment');

            // ゲーム開始処理
            function startGame(mode) {
                currentQuestions = questionSets[mode];
                startScreen.style.display = 'none';
                questionScreen.style.display = 'block';
                currentQuestionIndex = 0;
                perfectScoreCount = 0;
                showQuestion(currentQuestionIndex);
            }

            startNormalBtn.addEventListener('click', () => startGame('normal'));
            startHardBtn.addEventListener('click', () => startGame('hard'));
            startBrainBtn.addEventListener('click', () => startGame('brain'));

            // 問題表示
            function showQuestion(index) {
                const q = currentQuestions[index];
                qNumber.textContent = `Q${index + 1}`;
                qTitle.textContent = q.title;
                qText.textContent = q.text;
                answerInput.value = '';
                
                hintMsg.style.display = 'none';
                hintMsg.textContent = q.hint;
                hintBtn.style.display = 'inline-block';
                
                hasMistaken = false;
                hasUsedHint = false;
                answerInput.focus();
                
                questionScreen.classList.remove('fade-in-up');
                void questionScreen.offsetWidth;
                questionScreen.classList.add('fade-in-up');
            }

            // ヒント表示
            hintBtn.addEventListener('click', () => {
                hintMsg.style.display = 'block';
                hintBtn.style.display = 'none';
                hasUsedHint = true;
            });

            // 回答チェック
            submitBtn.addEventListener('click', checkAnswer);
            
            // Enterキーでも回答可能に
            answerInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkAnswer();
            });

            function checkAnswer() {
                const inputVal = answerInput.value.trim().replace(/\s+/g, ''); // 空白除去
                const currentQ = currentQuestions[currentQuestionIndex];

                // 大文字小文字を区別しない比較
                const isCorrect = currentQ.answer.some(ans => ans.toLowerCase() === inputVal.toLowerCase());

                if (isCorrect) {
                    // 正解
                    if (!hasMistaken && !hasUsedHint) {
                        perfectScoreCount++;
                    }

                    currentQuestionIndex++;
                    if (currentQuestionIndex < currentQuestions.length) {
                        showQuestion(currentQuestionIndex);
                    } else {
                        // 全問正解（クリア）
                        showClearScreen();
                    }
                } else {
                    // 不正解
                    hasMistaken = true;
                    answerInput.classList.add('shake');
                    
                    // 画面フラッシュ演出
                    gameContainer.classList.add('flash-effect');

                    setTimeout(() => {
                        answerInput.classList.remove('shake');
                        gameContainer.classList.remove('flash-effect');
                    }, 500);
                }
            }

            function showClearScreen() {
                questionScreen.style.display = 'none';
                clearScreen.style.display = 'block';
                clearScreen.classList.add('fade-in-up');

                // ランク判定
                let rankTitle = "";
                let rankComment = "";

                if (perfectScoreCount === 5) {
                    rankTitle = "👑 謎解き王";
                    rankComment = "ノーヒントで全問正解！<br>あなたのIQは測定不能レベルです。";
                } else if (perfectScoreCount >= 4) {
                    rankTitle = "✨ 名探偵";
                    rankComment = "素晴らしいひらめき力！<br>ほとんどの謎を見破りました。";
                } else if (perfectScoreCount >= 2) {
                    rankTitle = "👍 駆け出し探偵";
                    rankComment = "なかなかの推理力です。<br>頭の体操になりましたね！";
                } else {
                    rankTitle = "🔰 見習い";
                    rankComment = "クリアおめでとうございます！<br>ヒントを頼りに最後まで辿り着きました。";
                }

                resultRank.textContent = rankTitle;
                resultComment.innerHTML = rankComment;
            }

            // シェアボタン
            shareBtn.addEventListener('click', () => {
                const rankText = resultRank.textContent;
                const text = `🕵️‍♂️下北沢・上級謎解きゲームをクリア！\n称号：【${rankText}】\n激ムズの論理パズル、あなたは解ける？\n#下北コミュニティ #下北沢謎解き`;
                const url = window.location.href;
                const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
                window.open(twitterUrl, '_blank');
            });
        });
    </script>
    <script src="assets/js/footer.js" defer></script>
</body>
</html>
