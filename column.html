<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下北沢コラム | 下北コミュニティ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* --- フィルタリング --- */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 25px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-family: inherit;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: white;
        }
        
        /* --- コラムカード --- */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .article-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .article-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
        }
        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .article-card:hover .article-img {
            transform: scale(1.05);
        }
        
        .article-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .article-category {
            font-size: 0.75rem;
            color: #fff;
            margin-bottom: 10px;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            align-self: flex-start;
            font-weight: bold;
        }
        .cat-gourmet { background-color: #e67e22; }
        .cat-culture { background-color: #3498db; }
        .cat-deai { background-color: #e74c3c; }
        .cat-active { background-color: #2ecc71; }
        .cat-cafe { background-color: #8d6e63; }
        
        .article-title {
            margin: 0 0 10px;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .article-excerpt {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .article-link {
            margin-top: auto;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            padding-top: 15px;
        }
        .article-link::after {
            content: "→";
            margin-left: 5px;
            transition: transform 0.2s;
        }
        .article-link:hover::after {
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <header class="header">
    </header>
    <script src="assets/js/header.js" data-path-prefix="" defer></script>

    <section class="section main-content fade-in">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">下北沢コラム</h2>
            </div>
            <p style="text-align: center; margin-bottom: 40px;">下北沢の魅力や、サークル活動の裏側などを<br>ブログ形式でお届けします。</p>

            <!-- フィルタリングボタン -->
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="deai">出会い・サークル</button>
                <button class="filter-btn" data-filter="gourmet">グルメ</button>
                <button class="filter-btn" data-filter="culture">カルチャー</button>
                <button class="filter-btn" data-filter="active">アクティブ</button>
                <button class="filter-btn" data-filter="cafe">カフェ</button>
            </div>

            <!-- コラム一覧 -->
            <div id="article-grid" class="article-grid">
                <!-- JSで生成 -->
            </div>

            <div style="text-align: center; margin-top: 50px;">
                <a href="index.html" class="back-link">トップページに戻る</a>
            </div>
        </div>
    </section>

    <footer>
    </footer>

    <script src="assets/js/articles.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // articles と categoryNames は articles.js から読み込まれます
            const grid = document.getElementById('article-grid');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            function renderArticles(filter) {
                grid.innerHTML = '';
                const filteredArticles = filter === 'all' ? articles : articles.filter(a => a.category === filter);

                filteredArticles.forEach((article, index) => {
                    const card = document.createElement('div');
                    card.className = 'article-card fade-in';
                    card.style.animationDelay = `${index * 0.05}s`;

                    const catName = categoryNames[article.category];

                    card.innerHTML = `
                        <div class="article-img-wrapper">
                            <img src="${article.imageUrl}" alt="${article.title}" class="article-img">
                        </div>
                        <div class="article-content">
                            <span class="article-category cat-${article.category}">${catName}</span>
                            <h3 class="article-title">${article.title}</h3>
                            <p class="article-excerpt">${article.excerpt}</p>
                            <a href="${article.detailUrl}" class="article-link">続きを読む</a>
                        </div>
                    `;
                    grid.appendChild(card);
                    observer.observe(card);
                });
            }

            // 初期表示
            renderArticles('all');

            // フィルタリング処理
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderArticles(btn.dataset.filter);
                });
            });

            // ページ全体のフェードイン
            document.querySelector('.main-content.fade-in')?.classList.add('visible');
        });
    </script>
    <script src="assets/js/footer.js" data-path-prefix="" defer></script>
</body>
</html>
