<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | 下北コミュニティ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: var(--accent-hover);
        }
        .login-links {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
        }
        .login-links a {
            color: var(--accent-color);
            text-decoration: none;
            display: inline-block;
            margin: 5px 0;
        }
        .login-links a:hover {
            text-decoration: underline;
        }
        .divider {
            margin: 20px 0;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">下北コミュニティ</a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">トップ</a></li>
                <li><a href="schedule.html">活動予定</a></li>
                <li><a href="recommend.html">おすすめ</a></li>
                <li><a href="column.html">コラム</a></li>
                <li><a href="mystery.html">謎解き</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
                <li><a href="login.html" style="color: var(--accent-color); font-weight: bold;">ログイン</a></li>
            </ul>
        </nav>
    </header>

    <section class="section main-content fade-in">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">ログイン</h2>
            </div>

            <div class="login-container">
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
                    </div>
                    <button type="submit" class="submit-btn">ログインする</button>
                </form>

                <div class="login-links">
                    <div class="divider"></div>
                    <p>アカウントをお持ちでない方は</p>
                    <a href="register.html" style="font-weight: bold; font-size: 1rem;">新規会員登録はこちら</a>
                    <br><br>
                    <a href="forgot-password.html" style="color: #888; font-size: 0.85rem;">パスワードをお忘れの方</a>
                </div>
            </div>

            <div style="text-align: center; margin-top: 40px;">
                <a href="index.html" class="back-link">トップページに戻る</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p class="copyright">&copy; 2026 下北コミュニティ. All Rights Reserved.</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDubc2FGMimITJS_MXbzgLY_G1nO_NoAI0",
            authDomain: "tokyonakama-e7331.firebaseapp.com",
            projectId: "tokyonakama-e7331",
            storageBucket: "tokyonakama-e7331.firebasestorage.app",
            messagingSenderId: "538079381768",
            appId: "1:538079381768:web:af9fcb02569c266279c4bd",
            measurementId: "G-BWM0Q87Q93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ページ読み込み時のフェードイン
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelector('.main-content.fade-in')?.classList.add('visible');
        });

        // ログイン処理
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = this.querySelector('.submit-btn');
            
            // ボタンを無効化
            submitBtn.disabled = true;
            submitBtn.textContent = 'ログイン中...';

            try {
                // Firebase Authでログイン
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Firestoreのログイン情報更新（回数+1, 最終ログイン日時）
                try {
                    const userRef = doc(db, "users", user.uid);
                    await updateDoc(userRef, {
                        loginCount: increment(1),
                        lastLogin: serverTimestamp()
                    });
                } catch (dbError) {
                    console.error("Firestore update error:", dbError);
                }

                alert('ログインしました！');
                window.location.href = 'index.html';

            } catch (error) {
                console.error('Error:', error);
                let msg = 'ログインに失敗しました。';
                // auth/invalid-credential は最近のSDKでユーザーが存在しない/パスワード違いをまとめたエラーです
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = 'メールアドレスまたはパスワードが間違っています。';
                } else if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                    msg = '管理者設定エラー：ログイン方法が無効になっています。Firebaseコンソールを確認してください。';
                } else {
                    msg += `\n(${error.code})`;
                }
                alert(msg);
            } finally {
                // ボタンを元に戻す
                submitBtn.disabled = false;
                submitBtn.textContent = 'ログインする';
            }
        });
    </script>
</body>
</html>
