<head>

    <style>
        /* --- 固有スタイル --- */
        #map {
            height: 450px;
            margin-bottom: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1;
        }
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 0 10px;
        }
        .filter-btn {
            padding: 10px 25px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-family: inherit;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        /* カテゴリごとのボタン色設定 */
        .filter-btn[data-filter="cafe"] { border-color: #e67e22; color: #e67e22; }
        .filter-btn[data-filter="cafe"].active, .filter-btn[data-filter="cafe"]:hover { background-color: #e67e22; color: white; }

        .filter-btn[data-filter="curry"] { border-color: #f1c40f; color: #b7950b; } /* 可読性のため文字は少し濃い色 */
        .filter-btn[data-filter="curry"].active, .filter-btn[data-filter="curry"]:hover { background-color: #f1c40f; color: #333; }

        .filter-btn[data-filter="furugi"] { border-color: #27ae60; color: #27ae60; }
        .filter-btn[data-filter="furugi"].active, .filter-btn[data-filter="furugi"]:hover { background-color: #27ae60; color: white; }

        .filter-btn[data-filter="theater"] { border-color: #8e44ad; color: #8e44ad; }
        .filter-btn[data-filter="theater"].active, .filter-btn[data-filter="theater"]:hover { background-color: #8e44ad; color: white; }

        .filter-btn[data-filter="spot"] { border-color: #3498db; color: #3498db; }
        .filter-btn[data-filter="spot"].active, .filter-btn[data-filter="spot"]:hover { background-color: #3498db; color: white; }
        
        .spot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .spot-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .spot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .spot-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
        }
        .spot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .spot-card:hover .spot-img {
            transform: scale(1.05);
        }
        
        .spot-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .spot-category {
            font-size: 0.75rem;
            color: #fff;
            margin-bottom: 10px;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            align-self: flex-start;
            font-weight: bold;
        }
        .cat-cafe { background-color: #e67e22; }
        .cat-curry { background-color: #f1c40f; color: #333; }
        .cat-furugi { background-color: #27ae60; }
        .cat-theater { background-color: #8e44ad; }
        .cat-spot { background-color: #3498db; }
        
        .spot-title {
            margin: 0 0 10px;
            font-size: 1.1rem;
            line-height: 1.4;
        }
        
        .spot-description {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
            margin: 10px 0;
        }

        .spot-link {
            margin-top: auto;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            padding-top: 15px;
        }
        .spot-link::after {
            content: "→";
            margin-left: 5px;
            transition: transform 0.2s;
        }
        .spot-link:hover::after {
            transform: translateX(3px);
        }

        /* リンクボタンのコンテナ（修正①） */
        .spot-links {
            display: flex;
            gap: 15px;
            margin-top: auto;
            padding-top: 15px;
            flex-wrap: wrap;
        }
        .spot-link-detail {
            color: #27ae60; /* カフェ・カレー等に合う緑系 */
        }

        /* --- モーダルスタイル --- */
        @media (max-width: 768px) {
            #map {
                height: 350px;
            }
            .filter-btn {
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 500px;
            overflow: hidden;
            position: relative;
            animation: fadeInUp 0.3s ease;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: white;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .modal-body { padding: 25px; }
        .modal-img { width: 100%; height: 250px; object-fit: cover; }
        .modal-btn { margin-top: 20px; width: 100%; }
    </style>
</head>

                // Spot (その他)
                { name: "reload", category: "spot", description: "個性的なお店が集まる商業施設。散歩するだけでも楽しい。", address: "東京都世田谷区北沢3丁目19-20", img: "https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?auto=format&fit=crop&w=600&q=80" },
                { name: "BONUS TRACK", category: "spot", description: "商店街のような雰囲気の商業施設。飲食店や本屋、コワーキングスペースも。", address: "東京都世田谷区代沢5丁目21-1", img: "https://images.unsplash.com/photo-1449034446853-66c86144b0ad?auto=format&fit=crop&w=600&q=80" }
            ];

            // カテゴリごとの画像（ダミー）
            const categoryImages = {
                cafe: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                curry: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                furugi: "https://images.unsplash.com/photo-1593642632823-8f785ba67e45?auto=format&fit=crop&w=600&q=80",
                theater: "https://images.unsplash.com/photo-1507924538820-ede94a04019d?auto=format&fit=crop&w=600&q=80",
                spot: "https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            };

            const categoryNames = {
                cafe: "カフェ・喫茶",
                curry: "カレー",
                furugi: "古着屋", // 古着屋カテゴリ名を追加
                theater: "劇場・娯楽", // 劇場・娯楽カテゴリ名を追加
                spot: "その他"
            };

            // ピンの色（Googleマップ標準アイコンURL）
            const markerIcons = {
                cafe: "http://maps.google.com/mapfiles/ms/icons/orange-dot.png",
                curry: "http://maps.google.com/mapfiles/ms/icons/yellow-dot.png",
                furugi: "http://maps.google.com/mapfiles/ms/icons/green-dot.png", // 古着屋のピンを緑に設定
                theater: "http://maps.google.com/mapfiles/ms/icons/purple-dot.png", // 劇場・娯楽のピンを紫に設定
                spot: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
            };

            const grid = document.getElementById('spot-grid');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const modal = document.getElementById('spot-modal');
            const closeModal = document.getElementById('modal-close');
            
            // --- Google Map Initialization ---
            let map;
            let markers = [];
            let infoWindow;
            let geocoder; // ジオコーダーのインスタンス保持用
            let mapInitialized = false;

            // モーダル表示関数
            function openSpotModal(spot) {
                document.getElementById('modal-img').src = spot.img || categoryImages[spot.category];
                document.getElementById('modal-title').textContent = spot.name;
                document.getElementById('modal-desc').textContent = spot.description;
                document.getElementById('modal-map-link').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name)}`;
                modal.style.display = 'flex';
            }

            // モーダルを閉じる
            closeModal.addEventListener('click', () => modal.style.display = 'none');
            window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

            function renderSpots(filter) {
                grid.innerHTML = '';
                // Clear existing markers
                markers.forEach(m => m.setMap(null));
                markers = [];
                const bounds = new google.maps.LatLngBounds();

                const filteredSpots = filter === 'all' ? spots : spots.filter(s => s.category === filter);

                filteredSpots.forEach((spot, index) => {
                    const card = document.createElement('div');
                    card.className = 'spot-card fade-in';
                    card.style.transitionDelay = `${index * 0.05}s`; // ずらして表示

                    const imgUrl = spot.img || categoryImages[spot.category];
                    const catName = categoryNames[spot.category];

                    card.innerHTML = `
                        <div class="spot-img-wrapper">
                            <img src="${imgUrl}" alt="${spot.name}" class="spot-img">
                        </div>
                        <div class="spot-content">
                            <span class="spot-category cat-${spot.category}">${catName}</span>
                            <h3 class="spot-title">${spot.name}</h3>
                            <p class="spot-description">${spot.description}</p>
                            <div class="spot-links">
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name)}" target="_blank" rel="noopener noreferrer" class="spot-link">Googleマップで見る</a>
                                <a href="spot_detail.html?name=${encodeURIComponent(spot.name)}" class="spot-link spot-link-detail">おすすめを見る</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                    observer.observe(card);

                    // 住所文字列から座標を取得してマーカーを生成
                    if (spot.address) {
                        geocoder.geocode({ address: spot.address }, (results, status) => {
                            if (status === 'OK') {
                                const position = results[0].geometry.location;
                                const marker = new google.maps.Marker({
                                    position: position,
                                    map: map,
                                    title: spot.name,
                                    icon: markerIcons[spot.category] || "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
                                });
                                markers.push(marker);
                                bounds.extend(position);
                                map.fitBounds(bounds); // 全てのマーカーが収まるように表示範囲を調整

                                // 情報ウィンドウの内容
                                const infoContent = `
                                    <div style="padding:5px; max-width:200px;">
                                        <h4 style="margin:0 0 5px; color:var(--accent-color);">${spot.name}</h4>
                                        <p style="font-size:0.8rem; margin:0 0 5px; color:#666;">${spot.description}</p>
                                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name)}" target="_blank" style="font-size:0.8rem; color:var(--accent-color); font-weight:bold;">地図で開く</a>
                                    </div>
                                `;

                                // カードのホバー・クリック連動
                                card.addEventListener('mouseover', () => {
                                    infoWindow.setContent(infoContent);
                                    infoWindow.open(map, marker);
                                });
                                card.addEventListener('mouseout', () => infoWindow.close());
                                marker.addListener('click', () => {
                                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    openSpotModal(spot); // ピンクリックでモーダル表示
                                });
                            } else {
                                // ジオコーディング失敗時のエラー出力
                                console.error('住所の解析に失敗しました (' + spot.name + '): ' + status);
                            }
                        });
                    }
                });
            }

            // Google Mapsが読み込まれた後に実行
            window.initMap = function() {
                map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 35.661647, lng: 139.666679 },
                    zoom: 16,
                    mapTypeControl: false,
                    streetViewControl: true,
                });
                infoWindow = new google.maps.InfoWindow();
                geocoder = new google.maps.Geocoder(); // ジオコーダーのインスタンスを生成
                mapInitialized = true;
                renderSpots('all');
                
                // 自動ズームが強すぎる場合の調整
                google.maps.event.addListenerOnce(map, 'bounds_changed', function() {
                    if (this.getZoom() > 18) this.setZoom(18);
                });
            };

            // フィルタリング処理
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // アクティブクラスの切り替え
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // 描画
                    const filter = btn.dataset.filter;
                    renderSpots(filter);
                });
            });
        });
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCCOEPGikU9tjmiewQ0Kimh3_gtIXvhrI0&callback=initMap" async defer></script>

    <!-- モーダルHTML -->
    <div id="spot-modal" class="modal">
        <div class="modal-content">
            <span id="modal-close" class="modal-close">&times;</span>
            <img id="modal-img" src="" alt="" class="modal-img">
            <div class="modal-body">
                <h3 id="modal-title" class="spot-title"></h3>
                <p id="modal-desc" class="spot-description"></p>
                <a id="modal-map-link" href="" target="_blank" class="btn-cta modal-btn">Googleマップでナビを開始</a>
            </div>
        </div>
    </div>

    <script src="assets/js/footer.js" data-path-prefix="" defer></script>
</body>
</html>
