<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おすすめスポット | 下北コミュニティ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        /* --- 固有スタイル --- */
        #map {
            height: 400px;
            margin-bottom: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1;
        }
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 25px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-family: inherit;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: white;
        }
        
        .spot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .spot-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .spot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .spot-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
        }
        .spot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .spot-card:hover .spot-img {
            transform: scale(1.05);
        }
        
        .spot-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .spot-category {
            font-size: 0.75rem;
            color: #fff;
            margin-bottom: 10px;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            align-self: flex-start;
            font-weight: bold;
        }
        .cat-cafe { background-color: #e67e22; }
        .cat-curry { background-color: #f1c40f; color: #333; }
        .cat-spot { background-color: #3498db; }
        
        .spot-title {
            margin: 0 0 10px;
            font-size: 1.1rem;
            line-height: 1.4;
        }
        
        .spot-description {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
            margin: 10px 0;
        }

        .spot-link {
            margin-top: auto;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            padding-top: 15px;
        }
        .spot-link::after {
            content: "→";
            margin-left: 5px;
            transition: transform 0.2s;
        }
        .spot-link:hover::after {
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <header class="header">
    </header>
    <script src="assets/js/header.js" data-path-prefix="" defer></script>

    <section class="section main-content">
        <div class="container">
            <div class="section-header fade-in">
                <h2 class="section-title">下北沢のおすすめスポット</h2>
            </div>
            <p class="fade-in" style="text-align: center; margin-bottom: 40px;">活動の前後によく立ち寄るお店や、<br>メンバーおすすめのスポットをご紹介します。</p>

            <!-- Map -->
            <div id="map" class="fade-in"></div>

            <!-- フィルタリングボタン -->
            <div class="filter-container fade-in">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="curry">カレー</button>
                <button class="filter-btn" data-filter="cafe">カフェ・喫茶</button>
                <button class="filter-btn" data-filter="spot">その他</button>
            </div>

            <!-- スポット一覧 -->
            <div id="spot-grid" class="spot-grid">
                <!-- JSで生成 -->
            </div>

            <!-- ▼▼▼ 広告スペース ▼▼▼ -->
            <div class="ad-container fade-in" style="margin-top: 60px;">
                <span class="ad-label">スポンサーリンク</span>
                <a href="https://kkokichi.github.io/yuki-piano-lp/" target="_blank" rel="noopener sponsored">
                    <img src="assets/images/piano-concert.jpg" alt="ピアノコンサート" style="width:100%; max-width:300px; border-radius: 8px;">
                </a>
                <p style="font-size:0.9rem; margin-top:15px; margin-bottom:0;">【PR】下北沢でピアノコンサート開催。心温まる音色をあなたに。</p>
            </div>
            <!-- ▲▲▲ 広告スペース ▲▲▲ -->

            <div class="fade-in" style="text-align: center; margin-top: 50px;">
                <p style="margin-bottom: 10px;">「ここもおすすめ！」という情報があれば、<br>ぜひ教えてください！</p>
                <a href="contact.html" class="btn-cta">お問い合わせはこちら</a>
                <a href="index.html" class="back-link">トップページに戻る</a>
            </div>
        </div>
    </section>

    <footer>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // スクロール時のフェードインアニメーション
            const observerOptions = {
                root: null,
                rootMargin: "0px",
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            // このページで最初に読み込まれるfade-in要素を監視
            const staticFadeInElements = document.querySelectorAll(".fade-in");
            staticFadeInElements.forEach(el => observer.observe(el));

            // --- スポットデータ ---
            const spots = [
                // Cafe
                { name: "OGAWA COFFEE LABORATORY 下北沢", category: "cafe", description: "reload内にあるスタイリッシュな空間。Wi-Fi・電源完備で作業にも最適。", lat: 35.6622, lng: 139.6645 },
                { name: "W/O STAND SHIMOKITA", category: "cafe", description: "自販機が入り口の遊び心あるコーヒースタンド。写真映えも抜群。", lat: 35.6603, lng: 139.6685 },
                { name: "BOOKENDS COFFEE SERVICE", category: "cafe", description: "本に囲まれた空間で、こだわりのスペシャルティコーヒーが楽しめる。", lat: 35.6628, lng: 139.6691 },
                { name: "喫茶ネグラ", category: "cafe", description: "鮮やかな青い壁が印象的。レトロなクリームソーダが人気。", lat: 35.6609, lng: 139.6680 },
                { name: "トロワ・シャンブル", category: "cafe", description: "レンガ造りの落ち着いた空間。ネルドリップで淹れる深煎りコーヒーが絶品。", lat: 35.6602, lng: 139.6672 },
                { name: "CITY COUNTRY CITY", category: "cafe", description: "レコードショップ併設。音楽好きにはたまらない空間。", lat: 35.6600, lng: 139.6675 },
                { name: "kate coffee", category: "cafe", description: "自家焙煎のスペシャルティコーヒーと、美味しい焼き菓子が楽しめる。", lat: 35.6635, lng: 139.6690 },
                { name: "ON THE WAY, coffee & cupcake", category: "cafe", description: "見た目も可愛いカップケーキが人気。手土産にも喜ばれる。", lat: 35.6639, lng: 139.6698 },
                { name: "Brooklyn Roasting Company", category: "cafe", description: "ミカン下北にある広々としたカフェ。開放的なテラス席も。", lat: 35.6622, lng: 139.6645 },
                { name: "COFFEA EXLIBRIS", category: "cafe", description: "コーヒー豆の種類が豊富。バリスタと相談しながら好みの味を見つけられる。", lat: 35.6630, lng: 139.6640 },
                { name: "バロンデッセ", category: "cafe", description: "ラテアートが有名。ギャラリーも併設されているアートな空間。", lat: 35.6630, lng: 139.6695 },
                { name: "モルディブ", category: "cafe", description: "昔ながらの喫茶店。カレーやピラフなど、フードメニューも充実。", lat: 35.6608, lng: 139.6678 },
                { name: "フリッパーズ 下北沢店", category: "cafe", description: "「奇跡のパンケーキ」で有名。ふわふわ食感がたまらない。", lat: 35.6620, lng: 139.6688 },
                
                // Curry
                { name: "マジックスパイス 東京下北沢店", category: "curry", description: "スープカレーの元祖。辛さの段階が「虚空」まであることで有名。", lat: 35.6645, lng: 139.6648 },
                { name: "Rojiura Curry SAMURAI. 下北沢店", category: "curry", description: "ゴロゴロ野菜がたっぷり入った、北海道発の人気スープカレー店。", lat: 35.6633, lng: 139.6655 },
                { name: "旧ヤム邸 シモキタ荘", category: "curry", description: "大阪発のスパイスカレー。月替わりの独創的なあいがけカレーが楽しめる。", lat: 35.6629, lng: 139.6640 },
                { name: "茄子おやじ", category: "curry", description: "40年以上続く老舗。どこか懐かしい、優しい味わいの欧風カレー。", lat: 35.6640, lng: 139.6650 },
                { name: "般゜若 PANNYA CAFE CURRY", category: "curry", description: "薬膳スパイスカレーの有名店。サラサラのルーが特徴的。", lat: 35.6648, lng: 139.6695 },
                { name: "カレーの惑星", category: "curry", description: "ドライカレーと数種類のカレーをあいがけで楽しめる。見た目も美しい一皿。", lat: 35.6642, lng: 139.6649 },
                { name: "SAMA 下北沢店", category: "curry", description: "札幌発のスープカレー店。トマトベースやココナッツベースなど、スープの種類が豊富。", lat: 35.6603, lng: 139.6682 },
                { name: "NAN STATION", category: "curry", description: "チーズナンが絶品。本格的なインド・ネパール料理が楽しめる。", lat: 35.6610, lng: 139.6690 },
                { name: "スパイスラーメン 点と線.", category: "curry", description: "スープカレーとラーメンが融合した、新感覚のスパイスラーメン。", lat: 35.6629, lng: 139.6640 },
                { name: "ポニピリカ", category: "curry", description: "野菜たっぷりのスープカレーが人気。店内もおしゃれで女性に人気。", lat: 35.6605, lng: 139.6679 },
                { name: "犬拳堂", category: "curry", description: "キーマカレーが名物。濃厚な味わいでファンが多い。", lat: 35.6638, lng: 139.6692 },
                { name: "カレー食堂 心 下北沢店", category: "curry", description: "スープカレーの草分け的存在。安定の美味しさ。", lat: 35.6600, lng: 139.6685 },
                { name: "202カリー堂", category: "curry", description: "創作スパイスカレーが楽しめる。SNSでも話題の人気店。", lat: 35.6630, lng: 139.6640 },
                { name: "無敵のカレー", category: "curry", description: "カツカレーが人気。ボリューム満点でガッツリ食べたい時に。", lat: 35.6608, lng: 139.6688 },
                { name: "スパイスキッチン ムーナ", category: "curry", description: "本格的な南インド料理が味わえる。ミールスがおすすめ。", lat: 35.6635, lng: 139.6645 },

                // Spot
                { name: "reload", category: "spot", description: "個性的なお店が集まる商業施設。散歩するだけでも楽しい。", lat: 35.6622, lng: 139.6645 },
                { name: "BONUS TRACK", category: "spot", description: "商店街のような雰囲気の商業施設。飲食店や本屋、コワーキングスペースも。", lat: 35.6630, lng: 139.6640 }
            ];

            // カテゴリごとの画像（ダミー）
            const categoryImages = {
                cafe: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                curry: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                spot: "https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            };

            const categoryNames = {
                cafe: "カフェ・喫茶",
                curry: "カレー",
                spot: "その他"
            };

            const grid = document.getElementById('spot-grid');
            const filterBtns = document.querySelectorAll('.filter-btn');
            
            // --- Map Initialization ---
            const map = L.map('map').setView([35.662, 139.667], 16); // Centered on Shimokitazawa
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            const markers = L.layerGroup().addTo(map);

            function renderSpots(filter) {
                grid.innerHTML = '';
                markers.clearLayers(); // Clear existing markers
                const filteredSpots = filter === 'all' ? spots : spots.filter(s => s.category === filter);

                filteredSpots.forEach((spot, index) => {
                    const card = document.createElement('div');
                    card.className = 'spot-card fade-in';
                    card.style.transitionDelay = `${index * 0.05}s`; // ずらして表示

                    const imgUrl = categoryImages[spot.category];
                    const catName = categoryNames[spot.category];

                    card.innerHTML = `
                        <div class="spot-img-wrapper">
                            <img src="${imgUrl}" alt="${spot.name}" class="spot-img">
                        </div>
                        <div class="spot-content">
                            <span class="spot-category cat-${spot.category}">${catName}</span>
                            <h3 class="spot-title">${spot.name}</h3>
                            <p class="spot-description">${spot.description}</p>
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name)}" target="_blank" rel="noopener noreferrer" class="spot-link">Googleマップで見る</a>
                        </div>
                    `;
                    grid.appendChild(card);
                    observer.observe(card);

                    // Add marker to map
                    if (spot.lat && spot.lng) {
                        const marker = L.marker([spot.lat, spot.lng]);
                        marker.bindPopup(`<b>${spot.name}</b>`);
                        markers.addLayer(marker);

                        // カードのホバーでポップアップ表示
                        card.addEventListener('mouseover', () => marker.openPopup());
                        card.addEventListener('mouseout', () => marker.closePopup());
                        marker.on('click', () => card.scrollIntoView({ behavior: 'smooth', block: 'center' }));
                    }
                });
            }

            // 初期表示
            renderSpots('all');

            // フィルタリング処理
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // アクティブクラスの切り替え
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // 描画
                    const filter = btn.dataset.filter;
                    renderSpots(filter);
                });
            });
        });
    </script>
    <script src="assets/js/footer.js" data-path-prefix="" defer></script>
</body>
</html>
