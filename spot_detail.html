<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* 詳細ページ固有スタイル */
        .detail-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .back-link-wrapper { margin-bottom: 20px; }
        .spot-header { margin-bottom: 30px; text-align: center; }
        .spot-detail-img { width: 100%; max-height: 450px; object-fit: cover; border-radius: var(--border-radius); margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .spot-detail-content { background: white; padding: 30px; border-radius: var(--border-radius); box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .category-badge { display: inline-block; padding: 5px 15px; border-radius: 50px; color: white; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; }
        .cat-cafe { background-color: #e67e22; }
        .cat-curry { background-color: #f1c40f; color: #333; }
        .cat-spot { background-color: #3498db; }
        .spot-desc { font-size: 1.1rem; line-height: 1.8; color: #333; margin-bottom: 25px; }
        
        /* 基本情報カード */
        .info-summary-card { background: var(--accent-light); padding: 20px; border-radius: 15px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-around; align-items: center; border: 1px solid rgba(191,91,59,0.1); }
        .info-item { text-align: center; }
        .info-label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .info-value { font-weight: bold; font-size: 1.1rem; color: var(--text-color); }
        .stars { color: #f1c40f; margin-right: 5px; }
        
        /* 特徴ボックス */
        .info-box { margin-bottom: 25px; padding: 20px; border-radius: 12px; background: #fdfdfd; border-left: 5px solid var(--accent-color); }
        .info-box h3 { margin: 0 0 10px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        
        /* 口コミセクション */
        .review-section { margin-top: 50px; }
        .review-card { background: white; padding: 20px; border-radius: var(--border-radius); border: 1px solid #eee; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        .review-author { font-weight: bold; font-size: 0.95rem; }
        .review-comment { font-size: 0.9rem; line-height: 1.6; color: #555; }

        /* マップセクション */
        .map-section { margin-top: 40px; }
        .map-iframe { width: 100%; height: 400px; border: 0; border-radius: var(--border-radius); margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        @media (max-width: 600px) {
            .info-summary-card { flex-direction: column; align-items: flex-start; padding: 20px 30px; }
            .info-item { text-align: left; }
        }
    </style>
</head>

    </main>

        document.addEventListener("DOMContentLoaded", function() {
            // URLパラメータから店名を取得
            const params = new URLSearchParams(window.location.search);
            const spotName = params.get('name');
            const spot = spots.find(s => s.name === spotName);

            if (spot) {
                // スポット情報を反映（修正①・②）
                document.getElementById('spot-detail-view').style.display = 'block';
                document.getElementById('spot-name').textContent = spot.name;
                document.getElementById('spot-desc').textContent = spot.description;
                document.getElementById('spot-img').src = spot.img;
                document.getElementById('spot-img').alt = spot.name;
                
                // 星評価と基本情報の描画
                const starsHtml = '<span class="stars">' + '★'.repeat(Math.floor(spot.rating)) + '☆'.repeat(5 - Math.floor(spot.rating)) + '</span>';
                document.getElementById('spot-rating-val').innerHTML = `${starsHtml} ${spot.rating}`;
                document.getElementById('spot-price').textContent = spot.price;
                document.getElementById('spot-recommended').textContent = spot.recommended_for.join(' / ');
                
                // 看板メニューとヒントの描画
                document.getElementById('spot-best-menu').textContent = spot.best_menu;
                document.getElementById('spot-tips').textContent = spot.visit_tips;

                // 口コミの描画（修正⑤）
                const reviewList = document.getElementById('review-list');
                spot.reviews.forEach(review => {
                    const reviewCard = document.createElement('div');
                    reviewCard.className = 'review-card';
                    const rStars = '<span class="stars">' + '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating) + '</span>';
                    reviewCard.innerHTML = `
                        <div class="review-header">
                            <span class="review-author">${review.author}</span>
                            <span>${rStars}</span>
                        </div>
                        <p class="review-comment">${review.comment}</p>
                    `;
                    reviewList.appendChild(reviewCard);
                });

                const catBadge = document.getElementById('spot-cat');
                catBadge.textContent = spot.category === 'cafe' ? 'カフェ・喫茶' : spot.category === 'curry' ? 'カレー' : '商業施設・スポット';
                catBadge.classList.add('cat-' + spot.category);

                // マップ埋め込み
                document.getElementById('map-iframe').src = `https://maps.google.com/maps?q=${encodeURIComponent(spot.name)}&output=embed`;
                document.getElementById('nav-btn').href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(spot.name)}`;
            } else {
                // スポットが見つからない場合
                document.getElementById('error-view').style.display = 'block';
            }
        });
    </script>
